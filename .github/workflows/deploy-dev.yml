name: Build & Deploy (dev)

# Runs when commits land on develop — including merges of a PR into develop.
on:
  push:
    branches: [develop]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute lowercase image name
        id: meta
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}:dev" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: /opt/onlyoffice-app

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLYOFFICE_JWT_SECRET: ${{ secrets.ONLYOFFICE_JWT_SECRET }}
          ONLYOFFICE_DOCSERVER_URL: ${{ secrets.ONLYOFFICE_DOCSERVER_URL }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_API_PORT: ${{ secrets.MINIO_API_PORT || '9100' }}
          MINIO_CONSOLE_PORT: ${{ secrets.MINIO_CONSOLE_PORT || '9101' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # Pulling the large OnlyOffice image on first deploy can exceed the 10m default.
          command_timeout: 30m
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,ONLYOFFICE_JWT_SECRET,ONLYOFFICE_DOCSERVER_URL,MINIO_ROOT_USER,MINIO_ROOT_PASSWORD,MINIO_API_PORT,MINIO_CONSOLE_PORT
          script: |
            set -e
            cd /opt/onlyoffice-app

            # Authenticate to GHCR so the server can pull the private image (token is ephemeral).
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Write the env file consumed by docker compose.
            cat > .env <<EOF
            APP_IMAGE=$APP_IMAGE
            ONLYOFFICE_JWT_SECRET=$ONLYOFFICE_JWT_SECRET
            ONLYOFFICE_DOCSERVER_URL=$ONLYOFFICE_DOCSERVER_URL
            MINIO_ROOT_USER=$MINIO_ROOT_USER
            MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD
            MINIO_API_PORT=$MINIO_API_PORT
            MINIO_CONSOLE_PORT=$MINIO_CONSOLE_PORT
            EOF
            chmod 600 .env

            # Only pull the app image here. The heavy OnlyOffice/MinIO images are
            # pre-pulled once on the server; `up -d` reuses the local copies and only
            # recreates the app container when its image changed.
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
