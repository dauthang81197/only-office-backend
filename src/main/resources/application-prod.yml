# Activated with SPRING_PROFILES_ACTIVE=prod (see docker-compose.prod.yml).
# All values come from environment variables injected on the server.
server:
  port: 8081

app:
  # In the prod compose network the Document Server reaches this app by service name.
  public-url: ${APP_PUBLIC_URL:http://app:8081}

onlyoffice:
  # Browser-facing URL used to load api.js — MUST be the server's public address.
  docserver-url: ${ONLYOFFICE_DOCSERVER_URL}
  # Backend-facing URL; the Document Server is on the same docker network.
  docserver-inner-url: ${ONLYOFFICE_INNER_URL:http://onlyoffice}
  jwt-secret: ${ONLYOFFICE_JWT_SECRET}
  jwt-header: Authorization

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://minio:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:documents}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    path-style-access: true

logging:
  level:
    com.example.onlyoffice: INFO
